n Hinoyama has gone dark. Three nights now.",next:"c"},c:{speaker:"tsugumi",text:"Without its light the departed cannot find the far shore. They wander. They sour. We call them the Hollowed.",choices:[{text:"Who would put out the Lantern?",next:"d"},{text:"Tell me what to do.",next:"e"}]},d:{speaker:"tsugumi",text:"Not 'who' — 'what'. A mask with nothing behind it. The old songs call it Yomikage. It shattered the Lantern into three Ember Cores and scattered them across the valley.",next:"e"},e:{speaker:"tsugumi",text:"First, show these old eyes you remember your training. The dummies by the east wall won't hit back... much. Take this bow as well — a Warden should carry two weapons."}}),te("tsugumi_oath_wait",{a:{speaker:"tsugumi",text:"The training ground is past the well, by the east wall. Show me your form, Warden."}}),te("tsugumi_oath_done",{a:{speaker:"tsugumi",text:"Hm! Sloppy footwork, but your blade knows where it's going. That will do.",next:"b"},b:{speaker:"tsugumi",text:"Ash has been falling on Sasagiri Bamboo Grove, through the north gate. Where there is ash there is fire, and where there is fire this season... there is a Core.",next:"c"},c:{speaker:"tsugumi",text:"Take these dango. And visit Kanetsugu at the forge and Ohana at the tea house before you go. A Warden who travels alone travels badly."}}),te("tsugumi_bamboo_wait",{a:{speaker:"tsugumi",text:"The bamboo grove lies through the north gate. Be careful — the imps hunt in packs, and something larger commands them."}}),te("tsugumi_bamboo_done",{a:{speaker:"tsugumi",text:"The Ember Core of Ash... I can feel its warmth from here. You've done well, Warden.",next:"b"},b:{speaker:"tsugumi",text:"And a fox spirit at your heels? Kohaku, you old rascal. Keep the Warden alive.",next:"c"},c:{speaker:"kohaku",text:"Hmph. The Warden keeps ME alive. Mostly.",next:"d"},d:{speaker:"tsugumi",text:"The second Core sank beneath Mistfen Marsh. Ibuki the ferryman will know where. The east gate is open to you now."}}),te("tsugumi_marsh_wait",{a:{speaker:"tsugumi",text:"Mistfen lies beyond the east gate. Ibuki keeps the ferry there — find him before the mist finds you."}}),te("tsugumi_marsh_done",{a:{speaker:"tsugumi",text:"Two Cores. Listen — the Lantern's frame already hums with them.",next:"b"},b:{speaker:"tsugumi",text:"Only the last remains, and Yomikage holds it close. At the summit, where the Lantern once burned.",next:"c"},c:{speaker:"tsugumi",text:"Visit Mikoto at the shrine before you climb. The summit path opens only to those she has blessed."}}),te("tsugumi_summit_wait",{a:{speaker:"tsugumi",text:"The summit path begins behind the shrine. Go with Mikoto's blessing, and come back to us."}}),te("tsugumi_after",{a:{speaker:"tsugumi",text:"The Lantern burns again, and every soul in the valley can find its way. Rest a while, Warden. You have earned it."}}),te("kanetsugu_menu",{a:{speaker:"kanetsugu",text:"Steel doesn't sharpen itself. What do you need?",choices:[{text:"Upgrade my gear.",actions:["open:smith"],next:null},{text:"Need any help?",next:"work",cond:{available:"sq_ore"}},{text:"Farewell.",next:null}]},work:{speaker:"kanetsugu",text:"Ore. Spirit Ore. The Hollowed hoard it like magpies. Bring me five pieces and I'll make it worth your while.",choices:[{text:"I'll find some.",actions:["startQuest:sq_ore"],next:null},{text:"Not right now.",next:null}]}}),te("kanetsugu_ore_wait",{a:{speaker:"kanetsugu",text:"Five Spirit Ore. The Hollowed drop it when they fall. Want me to look at your gear while you're here?",choices:[{text:"Upgrade my gear.",actions:["open:smith"],next:null},{text:"Later.",next:null}]}}),te("kanetsugu_ore_done",{a:{speaker:"kanetsugu",text:"Five pieces, and good ones! Here — a naginata I've been tinkering with. Long reach, for a Warden who likes a little distance.",actions:["take:spirit_ore:5"]}}),te("ohana_menu",{a:{speaker:"ohana",text:"Welcome to the Fallen Leaf! Something warm for the road, Warden?",choices:[{text:"Show me your wares.",actions:["ope
