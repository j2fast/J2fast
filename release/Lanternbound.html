n Hinoyama has gone dark. Three nights now.",next:"c"},c:{speaker:"tsugumi",text:"Without its light the departed cannot find the far shore. They wander. They sour. We call them the Hollowed.",choices:[{text:"Who would put out the Lantern?",next:"d"},{text:"Tell me what to do.",next:"e"}]},d:{speaker:"tsugumi",text:"Not 'who' — 'what'. A mask with nothing behind it. The old songs call it Yomikage. It shattered the Lantern into three Ember Cores and scattered them across the valley.",next:"e"},e:{speaker:"tsugumi",text:"First, show these old eyes you remember your training. The dummies by the east wall won't hit back... much. Take this bow as well — a Warden should carry two weapons."}}),te("tsugumi_oath_wait",{a:{speaker:"tsugumi",text:"The training ground is past the well, by the east wall. Show me your form, Warden."}}),te("tsugumi_oath_done",{a:{speaker:"tsugumi",text:"Hm! Sloppy footwork, but your blade knows where it's going. That will do.",next:"b"},b:{speaker:"tsugumi",text:"Ash has been falling on Sasagiri Bamboo Grove, through the north gate. Where there is ash there is fire, and where there is fire this season... there is a Core.",next:"c"},c:{speaker:"tsugumi",text:"Take these dango. And visit Kanetsugu at the forge and Ohana at the tea house before you go. A Warden who travels alone travels badly."}}),te("tsugumi_bamboo_wait",{a:{speaker:"tsugumi",text:"The bamboo grove lies through the north gate. Be careful — the imps hunt in packs, and something larger commands them."}}),te("tsugumi_bamboo_done",{a:{speaker:"tsugumi",text:"The Ember Core of Ash... I can feel its warmth from here. You've done well, Warden.",next:"b"},b:{speaker:"tsugumi",text:"And a fox spirit at your heels? Kohaku, you old rascal. Keep the Warden alive.",next:"c"},c:{speaker:"kohaku",text:"Hmph. The Warden keeps ME alive. Mostly.",next:"d"},d:{speaker:"tsugumi",text:"The second Core sank beneath Mistfen Marsh. Ibuki the ferryman will know where. The east gate is open to you now."}}),te("tsugumi_marsh_wait",{a:{speaker:"tsugumi",text:"Mistfen lies beyond the east gate. Ibuki keeps the ferry there — find him before the mist finds you."}}),te("tsugumi_marsh_done",{a:{speaker:"tsugumi",text:"Two Cores. Listen — the Lantern's frame already hums with them.",next:"b"},b:{speaker:"tsugumi",text:"Only the last remains, and Yomikage holds it close. At the summit, where the Lantern once burned.",next:"c"},c:{speaker:"tsugumi",text:"Visit Mikoto at the shrine before you climb. The summit path opens only to those she has blessed."}}),te("tsugumi_summit_wait",{a:{speaker:"tsugumi",text:"The summit path begins behind the shrine. Go with Mikoto's blessing, and come back to us."}}),te("tsugumi_after",{a:{speaker:"tsugumi",text:"The Lantern burns again, and every soul in the valley can find its way. Rest a while, Warden. You have earned it."}}),te("kanetsugu_menu",{a:{speaker:"kanetsugu",text:"Steel doesn't sharpen itself. What do you need?",choices:[{text:"Upgrade my gear.",actions:["open:smith"],next:null},{text:"Need any help?",next:"work",cond:{available:"sq_ore"}},{text:"Farewell.",next:null}]},work:{speaker:"kanetsugu",text:"Ore. Spirit Ore. The Hollowed hoard it like magpies. Bring me five pieces and I'll make it worth your while.",choices:[{text:"I'll find some.",actions:["startQuest:sq_ore"],next:null},{text:"Not right now.",next:null}]}}),te("kanetsugu_ore_wait",{a:{speaker:"kanetsugu",text:"Five Spirit Ore. The Hollowed drop it when they fall. Want me to look at your gear while you're here?",choices:[{text:"Upgrade my gear.",actions:["open:smith"],next:null},{text:"Later.",next:null}]}}),te("kanetsugu_ore_done",{a:{speaker:"kanetsugu",text:"Five pieces, and good ones! Here — a naginata I've been tinkering with. Long reach, for a Warden who likes a little distance.",actions:["take:spirit_ore:5"]}}),te("ohana_menu",{a:{speaker:"ohana",text:"Welcome to the Fallen Leaf! Something warm for the road, Warden?",choices:[{text:"Show me your wares.",actions:["open:shop"],next:null},{text:"Any work?",next:"wisps",cond:{available:"sq_wisps"}},{text:"Any work?",next:"parcel",cond:{available:"sq_parcel"}},{text:"Farewell.",next:null}]},wisps:{speaker:"ohana",text:"Ember wisps keep drifting into my tea terraces and scorching the leaves! Snuff out five of the little menaces and I'll pay you handsomely.",choices:[{text:"Consider it done.",actions:["startQuest:sq_wisps"],next:null},{text:"Maybe later.",next:null}]},parcel:{speaker:"ohana",text:"Heading to the marsh? Would you take this to Ibuki? He's kept that ferry since my grandmother's time. Never says thank you, but he drinks every last leaf.",choices:[{text:"I'll deliver it.",actions:["startQuest:sq_parcel"],next:null},{text:"Not now.",next:null}]}}),te("ohana_wisps_done",{a:{speaker:"ohana",text:"The terraces are safe! Here's your bounty — and a little something to keep your spirit up.",next:"b"},b:{speaker:"ohana",text:"Come back any time. First cup is always on the house for Wardens. Second cup is double."}}),te("mikoto_menu",{a:{speaker:"mikoto",text:"The shrine is quiet today. Would you like to train, or rest a while?",choices:[{text:"Train my skills.",actions:["open:shrine"],next:null},{text:"Rest. (Restore health and save)",actions:["rest"],next:"rested"},{text:"Is anything troubling you?",next:"firefly",cond:{available:"sq_firefly"}},{text:"Is anything troubling you?",next:"sentinels",cond:{available:"sq_sentinels"}},{text:"Farewell.",next:null}]},rested:{speaker:"mikoto",text:"Your wounds are mended, and the shrine will remember this moment. The Hollowed you laid to rest have... stirred again, I am afraid."},firefly:{speaker:"mikoto",text:"A child spirit, Hotaru, never came to the shrine to cross over. Her bell was last heard among the bamboo. Would you find her?",choices:[{text:"I'll find her.",actions:["startQuest:sq_firefly"],next:null},{text:"Not yet.",next:null}]},sentinels:{speaker:"mikoto",text:"The stone sentinels in the marsh once guarded this very shrine. Now they guard nothing but rage. Will you lay three of them to rest?",choices:[{text:"I will.",actions:["startQuest:sq_sentinels"],next:null},{text:"Another time.",next:null}]}}),te("mikoto_firefly_done",{a:{speaker:"mikoto",text:"Her bell... and it's ringing so softly. Then she's on her way home.",next:"b"},b:{speaker:"mikoto",text:"Thank you, Warden. Please, take this fox charm. She would want you to have something quick and clever.",actions:["take:hotaru_bell"]}}),te("mikoto_sentinels_done",{a:{speaker:"mikoto",text:"I felt them go quiet, one by one. They can rest now. Take these — the essence of the old guardians should strengthen your gear."}}),te("mikoto_blessing",{a:{speaker:"mikoto",text:"So it's time. Kneel, Warden.",next:"b"},b:{speaker:"mikoto",text:"By ember and by lantern-light, may the path keep you, and may the dark forget your name.",actions:["heal","flag:blessing"],next:"c"},c:{speaker:"mikoto",text:"The summit path behind the shrine is open. Whatever waits for you up there... come back down."}}),te("ibuki_marsh",{a:{speaker:"ibuki",text:"Hm? A Warden. Haven't seen one this deep in the mist in forty years.",next:"b"},b:{speaker:"ibuki",text:"The catacomb doors are sealed by the three braziers of the old priests. Light them and the doors will remember how to open.",next:"c"},c:{speaker:"ibuki",text:"The braziers stand on the rises to the north, east and south of here. Mind the lurkers. They bite."}}),te("ibuki_parcel",{a:{speaker:"ibuki",text:"Is that... Ohana's tea? Hmph. Tell her the leaves are adequate.",actions:["take:tea_parcel"],next:"b"},b:{speaker:"ibuki",text:"...Tell her thank you. And take this. A crane charm. It never tires. Like me."}}),te("ibuki_idle",{a:{speaker:"ibuki",text:"The mist is thick today. It's always thick."}}),te("hotaru_found",{a:{speaker:"hotaru",text:"You can see me? Nobody can see me anymore...",next:"b"},b:{speaker:"hotaru",text:"I followed the fireflies and got lost, and then the imps came, and I hid and hid and hid.",choices:[{text:"Mikoto is waiting for you at the shrine.",next:"c"}]},c:{speaker:"hotaru",text:"The shrine lady? She gives me sweets. Can you bring her my bell? Then she'll know I'm going home.",actions:["give:hotaru_bell","flag:hotaru_saved"]}}),te("hotaru_idle",{a:{speaker:"hotaru",text:"Have you seen the fireflies? They went that way... or that way..."}}),te("kohaku_caged",{a:{speaker:"kohaku",text:"Psst! Warden! Get rid of those imps and get me out of this cage!"}}),te("kohaku_freed",{a:{speaker:"kohaku",text:"Finally! Do you know how long I have been in that cage? Three days. THREE.",next:"b"},b:{speaker:"kohaku",text:"Those imps thought a fox spirit would make a fine lantern. Rude.",next:"c"},c:{speaker:"kohaku",text:"You're the new Warden? Then you're going after the Iron-Gate Oni. I'm coming with you. Don't argue — I bite harder than I look.",actions:["flag:kohaku_joined"]}}),te("farmer_before",{a:{speaker:"farmer",text:"Ash on the wind again. My rice will taste of smoke this year — if the Hollowed leave any of it."}}),te("farmer_after",{a:{speaker:"farmer",text:"Smell that? Clean air. I may even plant the east terrace again. Thank you, Warden."}}),te("child_before",{a:{speaker:"child",text:"Are you really a Warden? Can I hold your sword?",choices:[{text:"Not today.",next:"b"},{text:"When you are older.",next:"b"}]},b:{speaker:"child",text:"Fine. But when I'm a Warden I'm getting a BIGGER lantern."}}),te("child_after",{a:{speaker:"child",text:"I saw it! The whole mountain lit up! I'm going to be a Warden. Definitely. Probably."}}),te("fisher_before",{a:{speaker:"fisher",text:"Three nights without the Lantern. The fish won't bite, and the dead won't rest. Bad omens, both."}}),te("fisher_after",{a:{speaker:"fisher",text:"The fish are biting again. And last night I dreamed of my wife, smiling, on the far shore. Good omens, both."}}),te("kohaku_idle",{a:{speaker:"kohaku",text:"What? I'm resting my eyes. I can still smell the Hollowed coming."}})].map(s=>[s.id,s]
